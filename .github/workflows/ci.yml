name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest
      - run: arap validate .
      - run: arap validate examples/minimal-project
      - run: arap gate examples/minimal-project --reviewer github-actions
      - run: python examples/local-ci/run.py "${{ runner.temp }}/arap-local-ci"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv wheel-venv
      - run: wheel-venv/bin/python -m pip install --no-deps dist/*.whl
      - run: wheel-venv/bin/arap --help
      - run: python -m venv sdist-venv
      - run: sdist-venv/bin/python -m pip install --no-deps dist/*.tar.gz
      - run: sdist-venv/bin/arap validate examples/minimal-project

