name: Feature proposal
description: Propose a bounded, evidence-backed improvement
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract and acceptance gates
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
    validations:
      required: true

