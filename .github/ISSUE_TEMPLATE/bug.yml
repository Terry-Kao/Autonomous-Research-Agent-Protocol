name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use a minimal example without secrets or private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ARAP version
    validations:
      required: true

