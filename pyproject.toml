[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arap"
version = "0.1.0a1"
description = "Evidence-first governance primitives for autonomous research agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Terry-Kao"}]
keywords = ["agents", "research", "governance", "reproducibility", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Terry-Kao/Autonomous-Research-Agent-Protocol"
Issues = "https://github.com/Terry-Kao/Autonomous-Research-Agent-Protocol/issues"
Source = "https://github.com/Terry-Kao/Autonomous-Research-Agent-Protocol"

[project.scripts]
arap = "arap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

